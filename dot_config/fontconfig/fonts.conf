<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <alias binding="same"><family>sans-serif</family>
    <prefer><family>DepartureMono Nerd Font Mono</family><family>Noto Color Emoji</family></prefer>
  </alias>
  <alias binding="same"><family>serif</family>
    <prefer><family>DepartureMono Nerd Font Mono</family><family>Noto Color Emoji</family></prefer>
  </alias>
  <alias binding="same"><family>monospace</family>
    <prefer><family>DepartureMono Nerd Font Mono</family><family>Noto Color Emoji</family></prefer>
  </alias>
</fontconfig>