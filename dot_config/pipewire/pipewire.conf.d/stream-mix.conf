context.objects = [
    {   factory = adapter
        args = {
            factory.name     = support.null-audio-sink
            node.name        = "stream_mix"
            node.description = "Stream Mix"
            media.class      = "Audio/Sink"
            audio.position   = [ FL FR ]
            monitor.channel-volumes = true
        }
    }
]

context.modules = [
    {   name = libpipewire-module-loopback
        args = {
            node.description = "Stream Mix to speakers"
            capture.props = {
                node.name           = "stream_mix_to_speakers.capture"
                target.object       = "stream_mix"
                stream.capture.sink = true
                node.passive        = true
                audio.position      = [ FL FR ]
            }
            playback.props = {
                node.name      = "stream_mix_to_speakers.playback"
                target.object  = "alsa_output.usb-ARTURIA_ArturiaMsd-00.analog-stereo"
                audio.position = [ FL FR ]
            }
        }
    }
]
